<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title }} · {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="article">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">Ahhlo</a>
    <nav>
      <a href="{{ '/faq/' | relative_url }}">FAQ</a>
      <a href="{{ '/switching/' | relative_url }}">Switching</a>
      <a href="{{ '/support/' | relative_url }}">Support</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
    </nav>
  </header>

  <main class="content">
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ site.time | date: '%Y' }} Bean Studio Apps. All rights reserved. · <a href="{{ '/terms/' | relative_url }}">Terms</a></p>
  </footer>
</body>
</html>
